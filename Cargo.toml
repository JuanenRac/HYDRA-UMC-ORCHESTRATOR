[package]
name = "hydra-umc-orchestrator"
version = "0.2.6"
edition = "2021"
rust-version = "1.85"
description = "Distributed system manager for multi-robot swarm coordination across the HYDRA-UMC ecosystem."
license = "GPL-3.0-or-later"
authors = ["JuanenRac (Electro Hobby 3D) <electrohobby3d@gmail.com>"]
repository = "https://github.com/JuanenRac/HYDRA-UMC-ORCHESTRATOR"

[[bin]]
name = "hydra-umc-orchestrator"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

# Real gap found auditing the ecosystem against actual CM5 hardware: the
# real mission state machine (mission.rs) was only ever reachable
# through mission-demo's own fixed, hardcoded scenario, never real
# caller-supplied commands. server.rs exposes the exact same
# MissionRegistry over a real HTTP API - still purely in-memory
# bookkeeping (dispatch/start/complete/cancel/fail/recover), no real
# gRPC wiring to NODE-HEALING. The only stop it sends is estop.rs: a latch
# plus a request to HYDRA-UMC-SERVER; main.rs's own module docs say the
# gRPC wiring remains real future work, this does not add it.
#
# ureq (new) - a real, minimal, blocking HTTP *client* (tiny_http above
# is server-only) so this repo can now call out to
# HYDRA-UMC-JOB-DISPATCHER's own real POST /jobs/submit and POST
# /dispatch (job_dispatcher.rs) - synchronous, no tokio/async runtime,
# same "closest thing to this ecosystem's other services' own stdlib
# HTTP calls" reasoning tiny_http itself was picked for.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false }

# The health service over gRPC (health_grpc.rs, off unless the configuration
# turns it on). tonic runs on its own runtime thread; the rest of the process
# stays as it was (blocking, tiny_http). The bindings are generated at build
# time from proto/hydra_common.proto, protoc comes from protoc-bin-vendored so
# no tool has to be installed.
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
