<title id="t">HYDRA-UMC-ORCHESTRATOR architecture</title>
<desc id="d">HYDRA-UMC-ORCHESTRATOR keeps missions in a registry with a state machine, hands jobs to the job dispatcher through an outbox, serves a gRPC health-report contract and recovers the missions of a node reported unreachable.</desc>
