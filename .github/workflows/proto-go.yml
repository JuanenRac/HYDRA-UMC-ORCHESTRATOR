# =============================================================================
# Installs protoc and the two Go plugins, generates the Go bindings of proto/hydra_common.proto exactly as the consumers keep them
# (src/healthpb of HYDRA-UMC-NODE-HEALING and HYDRA-UMC-JOB-DISPATCHER) and returns them as an artifact, with a note of which files differ from
# what each consumer has now. It pushes nothing and holds no secret: copy the files into the consumers by hand.

name: Go bindings of the health contract

on:
  workflow_dispatch:
    inputs:
      protoc_version:
        description: "protoc release to install (without the leading v)"
        type: string
        required: true
        default: "31.1"
      plugin_go_version:
        description: "protoc-gen-go version"
        type: string
        required: true
        default: "v1.36.12"
      plugin_grpc_version:
        description: "protoc-gen-go-grpc version"
        type: string
        required: true
        default: "v1.6.2"

permissions:
  contents: read

jobs:
  generate:
    name: Generate the bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTOC_VERSION: ${{ inputs.protoc_version }}
      PLUGIN_GO: ${{ inputs.plugin_go_version }}
      PLUGIN_GRPC: ${{ inputs.plugin_grpc_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out NODE-HEALING
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/HYDRA-UMC-NODE-HEALING
          path: node-healing
      - name: Check out JOB-DISPATCHER
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/HYDRA-UMC-JOB-DISPATCHER
          path: job-dispatcher
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install protoc and the plugins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROTOC_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::protoc_version has an unexpected shape"; exit 1; }
          [[ "$PLUGIN_GO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::plugin_go_version has an unexpected shape"; exit 1; }
          [[ "$PLUGIN_GRPC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::plugin_grpc_version has an unexpected shape"; exit 1; }
          mkdir -p "$RUNNER_TEMP/protoc" "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          GOBIN="$RUNNER_TEMP/bin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PLUGIN_GO}"
          GOBIN="$RUNNER_TEMP/bin" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PLUGIN_GRPC}"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Generate
        shell: bash
        run: |
          set -euo pipefail
          protoc --version
          mkdir -p out/src/healthpb
          protoc -I proto --go_out=out/src/healthpb --go_opt=paths=source_relative \
            --go-grpc_out=out/src/healthpb --go-grpc_opt=paths=source_relative proto/hydra_common.proto
          ls -l out/src/healthpb
          for c in node-healing job-dispatcher; do
            echo "### $c" >> "$GITHUB_STEP_SUMMARY"
            for f in hydra_common.pb.go hydra_common_grpc.pb.go; do
              if diff -q "out/src/healthpb/$f" "$c/src/healthpb/$f" > /dev/null; then echo "- $f: same" >> "$GITHUB_STEP_SUMMARY"; else echo "- $f: differs" >> "$GITHUB_STEP_SUMMARY"; fi
            done
          done
      - name: Check that the consumers build with the generated files
        shell: bash
        run: |
          set -euo pipefail
          for c in node-healing job-dispatcher; do
            cp out/src/healthpb/*.go "$c/src/healthpb/"
            (cd "$c" && go build ./... && go test ./src/healthpb/... ./... 2>&1 | tail -n 15)
          done
      - name: Upload the bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: healthpb-go
          path: out/src/healthpb/*.go
          if-no-files-found: error
