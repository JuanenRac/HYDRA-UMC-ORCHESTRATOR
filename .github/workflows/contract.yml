name: JOB-DISPATCHER contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Chain against the real JOB-DISPATCHER
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out JOB-DISPATCHER
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: JuanenRac/HYDRA-UMC-JOB-DISPATCHER
          path: job-dispatcher
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the compose file
        run: python tools/verify_compose.py
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build JOB-DISPATCHER
        run: cd job-dispatcher && go build -o ../job-dispatcher-bin .
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run the chain against it
        env:
          HYDRA_UMC_JOB_DISPATCHER_BIN: ${{ github.workspace }}/job-dispatcher-bin
        run: cargo test the_chain_works_against_the_real_job_dispatcher -- --nocapture
