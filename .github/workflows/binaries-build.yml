# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request. It compiles the release binaries of this repository from the exact
# commit it pins, checks that they carry the version of the project, and uploads them with SHA256SUMS and a build manifest as one artifact with a
# build-provenance attestation.
#
# It holds no key and signs nothing: the files are UNSIGNED. The signature of a release is made on the maintainer's machine, from this artifact, with the
# release key that never leaves it. With dry_run on (the default) nothing but the artifact is made; with it off a DRAFT release v<version> with the unsigned
# files is also prepared (it is never published from here, and the build stops if the tag already exists).
# A failed or stuck build writes the Job Summary and opens (or updates) the issue "build-failed"; a later good build closes it.

name: Binaries build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft release"
        type: boolean
        required: true
        default: true
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: binaries-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Work out the version and pin the commit
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('hydra-umc.project.json', encoding='utf-8'))['version'])")"
          source_version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")"
          [ "$source_version" = "$version" ] || { echo "::error::the source says $source_version, hydra-umc.project.json says $version (raise the version BEFORE the build)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.id }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            file: hydra-umc-orchestrator-linux-arm64
          - id: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            file: hydra-umc-orchestrator-linux-amd64
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false


      - name: Compile the binary
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cargo build --release --locked --bin hydra-umc-orchestrator
          cp "target/release/hydra-umc-orchestrator" "out/$FILE"
          chmod +x "$GITHUB_WORKSPACE/out/$FILE"
          file "$GITHUB_WORKSPACE/out/$FILE"


      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parts-${{ matrix.id }}
          path: out/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect, attest and prepare the draft
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: parts-*
          merge-multiple: true
          path: files

      - name: Write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd files
          test "$(ls | wc -l)" -eq 2 || { echo "::error::expected 2 binaries"; ls; exit 1; }
          sha256sum * > SHA256SUMS
          python3 - <<'PY'
          import json, os
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name)})
          json.dump({
              "schema": "hydra-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "orchestrator", "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "toolchain": "rust stable, cargo build --release --locked", "signed": False, "files": files,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS
          { echo "### HYDRA-UMC-ORCHESTRATOR $VERSION (unsigned)"; sed 's/^/- /' SHA256SUMS; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            files/hydra-umc-orchestrator-*
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-orchestrator-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare the draft release with the unsigned files
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag already exists: raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --target "$SHA" --title "HYDRA-UMC-ORCHESTRATOR $VERSION (unsigned build)" \
            --notes "Unsigned build made by GitHub Actions. The signed files of the release replace these."
          echo "- draft release \`$tag\` prepared with the unsigned files" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-orchestrator-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and len(manifest["files"]) == 2, "unexpected manifest"
          print("manifest ok:", manifest["project"], manifest["version"], len(manifest["files"]), "files")
          PY
          for file in hydra-umc-orchestrator-* SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" >/dev/null
            echo "attestation ok: $file"
          done

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.collect.result }} ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state open --json number --jq '.[0].number // empty')"
          bad=""
          for r in $RESULTS; do [ "$r" = "success" ] || bad="$bad $r"; done
          if [ -n "$bad" ]; then
            body="The build failed (plan / build / collect / verify: $RESULTS; anything but success counts as a failure: failure, timed out, cancelled or skipped). Run: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "A build in GitHub Actions failed" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "Build failed" --body "$body"
            fi
            echo "### The build failed: issue build-failed updated" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "A later build passed: $RUN_URL"
          fi

      - name: The notice itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::The build did not pass (${RESULTS}) and the issue build-failed could not be written. Run: ${RUN_URL}"
          echo "### The build did not pass and the issue could not be written" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: ${RESULTS}. Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
