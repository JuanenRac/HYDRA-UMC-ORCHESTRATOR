version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "ureq"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tonic"
        update-types:
          - "version-update:semver-patch"
      - dependency-name: "tonic-prost"
        update-types:
          - "version-update:semver-patch"
      - dependency-name: "tonic-prost-build"
        update-types:
          - "version-update:semver-patch"
    groups:
      cargo_updates:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    groups:
      github_actions_updates:
        patterns:
          - "*"
