name: Documentation correction
description: Report a missing, stale, unclear or broken public documentation item.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: repository
    attributes:
      label: Repository and file
      placeholder: URTC-TESTER/docs/CANBUS.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is incorrect or missing?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: Mention the README translations or file-tree entries that must stay synchronized.
